name: Test Installation
run-name: ${{ github.actor }} is running tests
on: [push]  
env:
  ecEnv_x86: esi-2026a
  ecEnv_file: esi-2026a.yml
jobs:
  Test-Install:
    name: Test Environment on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ "macos-latest", "windows-latest", "ubuntu-latest"]
        include:
          - os: windows-latest
            use_shell : pwsh
          - os: macos-latest
            use_shell : zsh
          - os: ubuntu-latest
            use_shell : bash
    steps:
      - name: Free Disk Space (Ubuntu)        
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/dotnet
      - name: Download repository
        uses: actions/checkout@v3
      - name: Using Minimamba
        uses: mamba-org//setup-micromamba@v3
        with:
          environment-file: ${{ env.ecEnv_file }}
          post-cleanup: 'all'
      - name: Activate environment ${{ env.ecEnv_x86 }} and run tests on ${{ matrix.os }}
        run: |
          ${{ matrix.prepare_shell }}
          conda activate ${{ env.ecEnv_x86 }}
          pytest -sv
          conda deactivate ${{ env.ecEnv_x86 }}

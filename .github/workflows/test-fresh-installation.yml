name: Test Installation
run-name: ${{ github.actor }} is running tests
on: [push]  
env:
  ecEnv_x86: esi-2026a
jobs:
  Test-Install:
    name: Install python, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ "macos-latest", "windows-latest", "ubuntu-latest"]
        include:
          - os: windows-latest
            install_script: .\libexec\install.ps1
            uninstall_script: .\libexec\uninstall.ps1
            use_shell : pwsh
            prepare_shell: Invoke-Expression "$Env:userprofile\miniforge3\shell\condabin\conda-hook.ps1"
          - os: macos-latest
            install_script: ./libexec/install.sh
            uninstall_script: ./libexec/uninstall.sh
            use_shell : zsh -il {0}
            prepare_shell: source ~/.zshrc
          - os: ubuntu-latest
            install_script: ./libexec/install.sh
            uninstall_script: ./libexec/uninstall.sh
            use_shell : bash -il {0}
            prepare_shell: source ~/.bashrc
    defaults:
      run:
        shell: ${{ matrix.use_shell }}
    steps:
      - name: Free Disk Space (Ubuntu)        
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/dotnet
      - name: Download repository
        uses: actions/checkout@v3
      - name: Install system packages on Linux
        if: runner.os == 'Linux'
      - name: Activate environment ${{ env.ecEnv_x86 }} and run tests on ${{ matrix.os }}
        run: |
          ${{ matrix.prepare_shell }}
          conda activate ${{ env.ecEnv_x86 }}
          pytest -sv
          conda deactivate ${{ env.ecEnv_x86 }}
